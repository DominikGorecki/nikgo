# Research-provenance records are deliberately limited to facts visible in the
# associated article or artifact. Use `unknown` when the repository does not
# preserve a detail; do not reconstruct a method from commit history or prose.
rag-capability-multiplier:
  research_question: "For research-style synthesis tasks, how does domain retrieval change judged output quality when compared with the same model and with a larger model without retrieval?"
  corpus: "Academic psychology and cognitive-science papers; the article reports 250,296 vectorized chunks."
  sample: "Three research prompts, five trials each, for 15 paired evaluations per experiment."
  collection_period: "unknown"
  systems: "Gemini 3 Flash with and without retrieval; Gemini 3 Pro without retrieval; ChatGPT 5.2 Thinking as the blinded pairwise judge."
  metrics: "Factual correctness, completeness, coherence, hallucination risk, and academic response."
  analysis: "Two-sided Wilcoxon signed-rank tests on paired differences."
  primary_finding: "The article reports statistically significant retrieval gains in four of five judged dimensions in both comparisons; coherence was not statistically significant."
  uncertainty: "The findings are limited to the reported prompts, corpus, conditions, and LLM-as-judge protocol."
  limitations:
    - "Only three prompts were evaluated."
    - "The corpus and tasks were concentrated in cognitive science and psychology."
    - "The evaluation used an LLM judge; the article identifies human-rating replication as future work."
    - "The results concern the tested system configuration, not model weights alone."
  materials_availability: "Raw data, prompts, model run records, and code were not located in this repository. This page makes no reproducibility claim."
  conflict_disclosure: "No conflict or funding statement was located in the source article."
  ai_assistance_disclosure: "The article names an LLM judge but does not document drafting or research-assistance use; this detail is unknown."
  external_sources: "The article's References section is the source inventory for its external claims."
  citation: "Gorecki, Dominik. (2026, January 26). Retrieval-Augmented Generation as a Capability Multiplier for Research Tasks. nikGo."

small-rag-versus-web-search:
  research_question: "Can Gemini 3 Flash with a domain-specific academic RAG corpus outperform Gemini 3 Pro with web-search grounding on the reported research tasks?"
  corpus: "Academic psychology and cognitive-science papers; the article reports 250,296 vectorized chunks of 300–500 words."
  sample: "Three research questions with five trials each, for 15 paired judgments."
  collection_period: "unknown"
  systems: "Gemini 3 Flash with domain RAG versus Gemini 3 Pro with search grounding; ChatGPT 5.2 Thinking as the blinded pairwise judge."
  metrics: "Overall score, factual correctness, completeness, coherence, hallucination risk, and academic response."
  analysis: "Two-sided Wilcoxon signed-rank test on paired differences."
  primary_finding: "The article reports favourable domain-RAG results for overall score and four of five dimensions, while coherence was not statistically significant."
  uncertainty: "Reported results are specific to the selected corpus, questions, model conditions, and LLM-as-judge evaluation."
  limitations:
    - "Only three domain-specific questions were evaluated."
    - "The source article reports LLM-as-judge rather than a human-rating replication."
    - "The comparison does not establish results for other domains, models, or retrieval systems."
  materials_availability: "Raw data, prompts, model run records, and code were not located in this repository. This page makes no reproducibility claim."
  conflict_disclosure: "No conflict or funding statement was located in the source article."
  ai_assistance_disclosure: "The article names an LLM judge but does not document drafting or research-assistance use; this detail is unknown."
  external_sources: "The article's References section is the source inventory for its external claims."
  citation: "Gorecki, Dominik. (2026, January 28). Domain-Specific RAG with Gemini 3 Flash Beats Pro with Web Search Grounding. nikGo."

rag-dose-response:
  research_question: "How does the amount of retrieved context affect response quality in the reported RAG configurations?"
  corpus: "Cognitive psychology questions retrieved through the VulcanLab RAG approach described in the article."
  sample: "Paired comparisons with reported sample sizes of 9–27, depending on the experiment."
  collection_period: "unknown"
  systems: "GPT-5.2 (extended thinking) for answer generation and Gemini 3 Pro Preview for response evaluation."
  metrics: "Overall score, academic response, coherence, completeness, factual correctness, hallucination risk, and readability measures."
  analysis: "Wilcoxon signed-rank tests; the article reports mean score differences."
  primary_finding: "The article reports diminishing marginal gains as retrieved context increases within the tested cognitive-psychology conditions."
  uncertainty: "The reported dose-response pattern may vary with domain, question difficulty, retrieval strategy, and model choice."
  limitations:
    - "The experiments used one subject domain: cognitive psychology."
    - "The source article says question difficulty may affect the result."
    - "Only retrieval volume was varied; other retrieval choices may alter the pattern."
    - "The source article used one answer-generation model and one judge model."
  materials_availability: "The article refers to linked Jupyter notebooks, but those notebooks and raw outputs were not located in this repository. This page makes no reproducibility claim."
  conflict_disclosure: "The article discusses VulcanLab; no separate conflict or funding statement was located in the source article."
  ai_assistance_disclosure: "The article names generation and judge models but does not document drafting or research-assistance use; this detail is unknown."
  external_sources: "The article's References section is the source inventory for its external claims."
  citation: "Gorecki, Dominik. (2026, January 8). The Dose-Response Curve of RAG: More Context Yields Diminishing Returns. nikGo."

