services:
  site:
    image: nikgo-site:github-pages-232
    platform: linux/amd64
    build:
      context: .
      args:
        BUNDLER_VERSION: "2.3.25"
    init: true
    working_dir: /srv/jekyll
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      BUNDLE_FROZEN: "true"
      HOME: /tmp
      JEKYLL_ENV: "${JEKYLL_ENV:-development}"
      PAGES_REPO_NWO: "DominikGorecki/nikgo"
    volumes:
      - .:/srv/jekyll
    ports:
      - "4000:4000"
